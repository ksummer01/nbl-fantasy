<style>

:root{
  --ground:#F2F4F8; --surface:#FFFFFF; --raised:#FFFFFF; --sunken:#E9ECF2;
  --line:#D8DDE7; --line-soft:#E8ECF3;
  --ink:#161A22; --ink-2:#39404E; --muted:#6E7787; --faint:#9AA3B2;
  --accent:#C97A06; --accent-ink:#FFFFFF; --accent-soft:#FDF1DC; --accent-line:#EFCF95;
  --win:#1E7F4E; --loss:#C0392B; --live:#D2382B; --info:#2563EB;
  --chip:#EEF1F6;
  --shadow:0 1px 2px rgba(18,24,38,.06), 0 8px 24px -12px rgba(18,24,38,.18);
  --r:10px; --r-s:6px;
  --f-disp:"Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --f-body:"Barlow", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101319; --surface:#171B23; --raised:#1E232D; --sunken:#0C0F14;
    --line:#2B323F; --line-soft:#222833;
    --ink:#EDF0F6; --ink-2:#C2C9D6; --muted:#8D97A8; --faint:#697385;
    --accent:#F5A524; --accent-ink:#1A1305; --accent-soft:#2A2213; --accent-line:#4A3A16;
    --win:#3FB27F; --loss:#E0574A; --live:#FF5A47; --info:#5B9BFF;
    --chip:#232935;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#101319; --surface:#171B23; --raised:#1E232D; --sunken:#0C0F14;
  --line:#2B323F; --line-soft:#222833;
  --ink:#EDF0F6; --ink-2:#C2C9D6; --muted:#8D97A8; --faint:#697385;
  --accent:#F5A524; --accent-ink:#1A1305; --accent-soft:#2A2213; --accent-line:#4A3A16;
  --win:#3FB27F; --loss:#E0574A; --live:#FF5A47; --info:#5B9BFF;
  --chip:#232935;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--f-disp);font-weight:700;letter-spacing:.005em;text-wrap:balance;line-height:1.1}
a{color:var(--info)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}

/* ---------- shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
.shell{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:16px 16px 12px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:9px}
.ball{width:24px;height:24px;border-radius:50%;background:var(--accent);position:relative;flex:0 0 auto}
.ball::before,.ball::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--accent-ink);opacity:.55}
.ball::before{border-left:none;border-right:none;transform:scaleX(.42)}
.ball::after{border-top:none;border-bottom:none;transform:scaleY(.42)}
.brand h1{font-size:19px;letter-spacing:.02em;text-transform:uppercase}
.brand small{display:block;font-family:var(--f-body);font-size:10px;font-weight:600;letter-spacing:.13em;color:var(--muted);text-transform:uppercase;margin-top:1px}
.nav{padding:8px;display:flex;flex-direction:column;gap:1px;overflow-y:auto;flex:1}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:var(--r-s);color:var(--ink-2);font-weight:500;cursor:pointer}
.nav button:hover{background:var(--chip);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600;box-shadow:inset 2px 0 0 var(--accent)}
.nav .badge{margin-left:auto;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;font-family:var(--f-mono)}
.nav .sect{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:14px 10px 5px}
.railfoot{padding:10px;border-top:1px solid var(--line-soft);display:flex;gap:6px;align-items:center}
.main{min-width:0;display:flex;flex-direction:column}

.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--ground) 88%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar .lg{font-family:var(--f-disp);font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.topbar .sep{width:1px;height:20px;background:var(--line)}
.rnd{display:flex;align-items:center;gap:6px}
.rnd b{font-family:var(--f-mono);font-weight:600;font-size:13px}
.spacer{flex:1}
.page{padding:22px;max-width:1280px;width:100%}
.pagehead{margin-bottom:16px}
.pagehead h2{font-size:27px;text-transform:uppercase;letter-spacing:.02em}
.pagehead p{margin:3px 0 0;color:var(--muted);font-size:14px;max-width:66ch}

/* ---------- bits ---------- */
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--faint)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card>.ch{padding:12px 14px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px}
.card>.ch h3{font-size:16px;text-transform:uppercase;letter-spacing:.03em}
.card>.cb{padding:14px}
.grid{display:grid;gap:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:7px 13px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover:not(:disabled){filter:brightness(1.07)}
.btn.dan{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 40%, var(--line))}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.gh{background:none;border-color:transparent}
.btn.gh:hover{background:var(--chip)}
.inp,select.inp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:7px 10px;width:100%}
label.fl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}
.field{margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--chip);color:var(--ink-2)}
.pill.live{background:color-mix(in srgb,var(--live) 16%, transparent);color:var(--live)}
.pill.win{background:color-mix(in srgb,var(--win) 16%, transparent);color:var(--win)}
.pill.loss{background:color-mix(in srgb,var(--loss) 16%, transparent);color:var(--loss)}
.pill.acc{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}
.blink{animation:bl 1.6s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.28}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}*{transition:none!important}}
.note{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--r-s);padding:10px 12px;font-size:13.5px;color:var(--ink-2)}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--f-disp);font-size:19px;color:var(--ink);text-transform:uppercase;margin-bottom:4px}

/* ---------- tables ---------- */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface);z-index:1}
th.l,td.l{text-align:left}
td{padding:7px 8px;border-bottom:1px solid var(--line-soft);text-align:right;white-space:nowrap}
tbody tr:hover{background:var(--chip)}
td.num,th.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stripe{display:inline-block;width:3px;height:22px;border-radius:2px;vertical-align:-6px;margin-right:8px}
.pname{font-weight:600}
.pmeta{font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:.03em}
.pos{display:inline-block;min-width:19px;text-align:center;font-family:var(--f-mono);font-size:11px;font-weight:600;padding:1px 4px;border-radius:4px;background:var(--chip);color:var(--ink-2)}
.pos.unk{color:var(--faint)}
.big{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- landing ---------- */
.land{max-width:1000px;margin:0 auto;padding:34px 22px 60px}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;margin-bottom:30px}
.hero h2{font-size:clamp(38px,6vw,62px);text-transform:uppercase;letter-spacing:.005em;line-height:.94}
.hero h2 em{font-style:normal;color:var(--accent)}
.hero p{color:var(--ink-2);font-size:16px;max-width:52ch;margin:14px 0 0}
.scorecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.scorecard .sc-h{padding:8px 13px;background:var(--sunken);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.sc-row{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line-soft)}
.sc-row:last-child{border-bottom:0}
.sc-row .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:9px}
.opt h3{font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.opt p{margin:0;color:var(--muted);font-size:13.5px;flex:1}

/* ---------- lineup ---------- */
.lineup{display:grid;gap:6px}
.slot{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px}
.slot.bench{background:var(--sunken)}
.slot.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.slot .lbl{font-family:var(--f-disp);font-size:15px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.slot.starter .lbl{color:var(--accent)}
.slot .who{min-width:0}
.slot .empt{color:var(--faint);font-style:italic;font-size:13.5px}

/* ---------- draft ---------- */
.draftgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.draftgrid>*{min-width:0}
.clock{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.clock.you{border-color:var(--accent);background:var(--accent-soft)}
.clock .t{font-family:var(--f-mono);font-size:34px;font-weight:600;letter-spacing:-.02em}
.board{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px}
.bcol{min-width:112px;flex:0 0 112px}
.bcol .bh{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:5px 6px;background:var(--sunken);border-radius:var(--r-s) var(--r-s) 0 0;border:1px solid var(--line);border-bottom:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcell{border:1px solid var(--line);border-top:0;padding:5px 6px;min-height:40px;font-size:11.5px;background:var(--surface)}
.bcell .pk{font-family:var(--f-mono);font-size:9.5px;color:var(--faint)}
.bcell.now{background:var(--accent-soft);border-color:var(--accent)}

/* ---------- matchup ---------- */
.mu{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.mu .side{min-width:0}
.mu .side.r{text-align:right}
.mu .tn{font-family:var(--f-disp);font-size:19px;text-transform:uppercase;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mu .sc{font-family:var(--f-mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.mu .vs{font-family:var(--f-disp);color:var(--faint);font-size:13px;letter-spacing:.1em}
.mu.won .sc{color:var(--win)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* ---------- modal / toast ---------- */
.veil{position:fixed;inset:0;background:rgba(8,10,15,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:100}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);width:100%;max-width:520px;max-height:88vh;overflow:auto}
.modal.wide{max-width:840px}
.modal .mh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h3{font-size:18px;text-transform:uppercase;letter-spacing:.03em;flex:1}
.modal .mb{padding:16px}
.modal .mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--sunken)}
#toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{background:var(--raised);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r-s);padding:10px 13px;box-shadow:var(--shadow);font-size:13.5px}
.toast.bad{border-left-color:var(--loss)}
.toast.good{border-left-color:var(--win)}

.tabbar{display:none}
@media (max-width:900px){
  .g2{grid-template-columns:1fr}
  .mu{grid-template-columns:1fr auto 1fr;gap:8px;padding:12px}
  .mu .tn{white-space:normal;font-size:16px}
  .mu .sc{font-size:24px}
  .topbar .lg{font-size:17px}
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  .hero{grid-template-columns:1fr}
  .draftgrid{grid-template-columns:1fr}
  .page{padding:16px 14px 78px}
  .topbar{padding:9px 14px}
  .land{padding:22px 14px 60px}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:5px 4px calc(5px + env(safe-area-inset-bottom));justify-content:space-around}
  .tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;color:var(--muted);padding:4px 6px;cursor:pointer;letter-spacing:.03em}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .tabbar .ic{font-size:16px;line-height:1}
}
/* ---------- leaderboard + squad (total-points build) ---------- */
.you{background:var(--accent-soft)}
.rankcell{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.rankcell b{color:var(--accent)}
.bars{display:flex;align-items:flex-end;gap:2px;height:26px}
.bars i{display:block;width:6px;background:var(--accent);border-radius:1px;opacity:.75}
.bars i.zero{background:var(--line);height:2px!important}
.hero-total{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.hero-total .n{font-family:var(--f-mono);font-size:clamp(38px,7vw,62px);font-weight:600;line-height:1;letter-spacing:-.02em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:11px 13px}
.kpi .k{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}

/* ============================================================
   LEAGUE DEFAULTS — season-long total points, no matchups.
   Every player on your squad scores every round.
   ============================================================ */
const STAT_KEYS = ["min","pts","reb","ast","stl","blk","to","fgm","fga","ftm","fta","tpm"];
const STAT_LABEL = {min:"MIN",pts:"PTS",reb:"REB",ast:"AST",stl:"STL",blk:"BLK",to:"TO",fgm:"FGM",fga:"FGA",ftm:"FTM",fta:"FTA",tpm:"3PM"};

const fpts = (line, scoring) => {
  if(!line) return 0;
  let t = 0;
  for(const k of SCORE_ORDER) t += (Number(line[k])||0) * (Number(scoring[k])||0);
  return Math.round(t*10)/10;
};
const r1 = n => Math.round(n*10)/10;
const uid = (n=8) => {
  const a = "abcdefghijklmnopqrstuvwxyz0123456789"; let s="";
  const buf = new Uint32Array(n);
  if(typeof crypto!=="undefined" && crypto.getRandomValues) crypto.getRandomValues(buf);
  for(let i=0;i<n;i++) s += a[(buf[i]||Math.floor(Math.random()*1e9))%a.length];
  return s;
};

/* ============================================================
   STORE — one surface, three backends:
     firebase  when window.FIREBASE_CONFIG is filled in
     claude    when running inside a Claude artifact
     memory    otherwise (local-only fallback)
   ============================================================ */
let BACKEND = "memory";          /* firebase | claude | memory */
let FB = null, CDB = null;
const listeners = [];
const mem = { docs:{}, subs:[] };

function memFire(path){ mem.subs.slice().forEach(f=>{ try{ f(path===undefined?null:path); }catch(e){ console.error(e); } }); }
function memDoc(path){
  return {
    id: path.split("/").pop(),
    async get(){ const d=mem.docs[path]; return {exists:!!d, data:()=> d?clone(d):undefined}; },
    async set(v){ mem.docs[path]=clone(v); memFire(path); },
    async update(v){ mem.docs[path]=Object.assign(mem.docs[path]||{}, clone(v)); memFire(path); },
    async delete(){ delete mem.docs[path]; memFire(path); },
    onSnapshot(next){
      const f = p => { if(p===path||p===null) next({exists:!!mem.docs[path], data:()=>mem.docs[path]?clone(mem.docs[path]):undefined}); };
      mem.subs.push(f); setTimeout(()=>f(path),0);
      return ()=>{ const i=mem.subs.indexOf(f); if(i>=0) mem.subs.splice(i,1); };
    }
  };
}
function memCol(path){
  const list = () => Object.keys(mem.docs)
    .filter(k=>k.startsWith(path+"/") && k.slice(path.length+1).indexOf("/")<0)
    .sort().map(k=>({id:k.split("/").pop(), exists:true, data:()=>clone(mem.docs[k])}));
  return {
    doc:(id)=>memDoc(path+"/"+(id||uid())),
    async get(){ const d=list(); return {docs:d,size:d.length,empty:!d.length}; },
    onSnapshot(next){
      const f = ()=>{ const d=list(); next({docs:d,size:d.length,empty:!d.length}); };
      mem.subs.push(f); setTimeout(f,0);
      return ()=>{ const i=mem.subs.indexOf(f); if(i>=0) mem.subs.splice(i,1); };
    }
  };
}
/* Firestore queues writes when it can't reach the server, so an await can
   hang indefinitely. Every write gets a deadline so the UI always responds. */
const WRITE_TIMEOUT_MS = 12000;
function deadline(p, label){
  return Promise.race([p, new Promise((_,rej)=>setTimeout(
    ()=>rej({code:"timeout", message:label+" didn't reach the database in time"}), WRITE_TIMEOUT_MS))]);
}
function fbDoc(path){
  const fs = FB.fs, ref = fs.doc(FB.db, path);
  return {
    id: ref.id,
    async get(){ const s = await deadline(fs.getDoc(ref), "Read"); return {exists:s.exists(), data:()=>s.data()}; },
    async set(v){ await deadline(fs.setDoc(ref, v), "Save"); },
    async update(v){ await deadline(fs.updateDoc(ref, v), "Update"); },
    async delete(){ await deadline(fs.deleteDoc(ref), "Delete"); },
    onSnapshot(next, err){ return fs.onSnapshot(ref, s=>next({exists:s.exists(), data:()=>s.data()}), e=>err&&err({code:e.code||"unavailable", message:e.message})); }
  };
}
function fbCol(path){
  const fs = FB.fs, ref = fs.collection(FB.db, path);
  return {
    doc:(id)=> fbDoc(path+"/"+(id||uid(10))),
    async get(){ const s = await fs.getDocs(ref); return {docs:s.docs.map(d=>({id:d.id,exists:true,data:()=>d.data()})), size:s.size, empty:s.empty}; },
    onSnapshot(next, err){ return fs.onSnapshot(ref, s=>next({docs:s.docs.map(d=>({id:d.id,exists:true,data:()=>d.data()})), size:s.size, empty:s.empty}), e=>err&&err({code:e.code||"unavailable", message:e.message})); }
  };
}
const store = {
  doc(path){
    if(BACKEND==="firebase") return fbDoc(path);
    if(BACKEND==="claude") return CDB.doc(path);
    return memDoc(path);
  },
  col(path){
    if(BACKEND==="firebase") return fbCol(path);
    if(BACKEND==="claude") return CDB.collection(path);
    return memCol(path);
  },
  shared(){ return BACKEND==="firebase" || BACKEND==="claude"; },
  /* read-modify-write that is atomic where the backend supports it */
  async tx(path, mutate){
    if(BACKEND==="firebase"){
      const fs = FB.fs, ref = fs.doc(FB.db, path);
      return await fs.runTransaction(FB.db, async t=>{
        const s = await t.get(ref);
        const next = mutate(s.exists() ? s.data() : null);
        if(next) t.set(ref, next);
        return next;
      });
    }
    if(BACKEND==="claude"){
      const ref = CDB.doc(path);
      try{ const lease = await ref.acquire({holder:ME.id, ttlMs:6000}); if(lease && lease.acquired===false) return null; }catch(e){}
      const s = await ref.get();
      const next = mutate(s.exists ? s.data() : null);
      if(next) await ref.set(next);
      return next;
    }
    const ref = store.doc(path);
    const s = await ref.get();
    const next = mutate(s.exists ? s.data() : null);
    if(next) await ref.set(next);
    return next;
  }
};

/* ============================================================
   SCORING — season-long totals. Every player on the squad
   scores every round. Points stay with whoever owned the
   player at the time, so a mid-season trade never moves
   points that were already banked.
   ============================================================ */
function roundsWithStats(){
  return Object.keys(S.stats).map(Number).filter(r=>S.stats[r] && S.stats[r].lines && Object.keys(S.stats[r].lines).length).sort((a,b)=>a-b);
}
function rosterAt(team, round){
  if(!team) return [];
  if(team.rosters && team.rosters[round]) return team.rosters[round];
  return team.roster || [];
}
function lineFor(round, pid){
  const s = S.stats[round];
  return s && s.lines ? s.lines[pid] : null;
}
function playerRoundFP(round, pid){
  const l = lineFor(round, pid);
  return l ? fpts(l, S.league.scoring) : 0;
}
function teamRoundFP(team, round){
  return r1(rosterAt(team, round).reduce((a,pid)=>a+playerRoundFP(round,pid),0));
}
function teamTotal(team){
  return r1(roundsWithStats().reduce((a,r)=>a+teamRoundFP(team,r),0));
}
function teamRoundSeries(team){
  const rs = roundsWithStats();
  return rs.map(r=>({round:r, fp:teamRoundFP(team,r)}));
}
/* what one player has banked FOR this team */
function playerForTeam(team, pid){
  let fp=0, rounds=0;
  roundsWithStats().forEach(r=>{
    if(rosterAt(team,r).includes(pid)){
      const v = playerRoundFP(r,pid);
      if(lineFor(r,pid)){ fp+=v; rounds++; }
    }
  });
  return {fp:r1(fp), rounds};
}
function leaderboard(){
  const rows = S.teams.map(t=>{
    const series = teamRoundSeries(t);
    const played = series.filter(s=>s.fp!==0).length || series.length;
    const total = r1(series.reduce((a,s)=>a+s.fp,0));
    const best = series.reduce((m,s)=> s.fp>m.fp?s:m, {round:0,fp:0});
    return {team:t, total, series, avg: series.length? r1(total/series.length):0,
            last: series.length? series[series.length-1].fp : 0, best};
  });
  rows.sort((a,b)=> b.total-a.total || a.team.name.localeCompare(b.team.name));
  rows.forEach((r,i)=> r.rank=i+1);
  return rows;
}
function seasonTotals(pid){
  const t = {gp:0}; STAT_KEYS.forEach(k=>t[k]=0);
  for(const r in S.stats){
    const l = S.stats[r].lines && S.stats[r].lines[pid];
    if(!l) continue;
    t.gp++; STAT_KEYS.forEach(k=> t[k] += Number(l[k])||0);
  }
  t.fp = S.league ? fpts(t, S.league.scoring) : 0;
  t.fppg = t.gp ? r1(t.fp/t.gp) : 0;
  return t;
}
const rosteredIds = () => { const s=new Set(); S.teams.forEach(t=>(t.roster||[]).forEach(p=>s.add(p))); return s; };
const ownerOf = pid => S.teams.find(t=>(t.roster||[]).includes(pid)) || null;

   ============================================================ */
const pathL   = id => "leagues/"+id;
const pathT   = id => "leagues/"+id+"/teams";
const pathD   = id => "leagues/"+id+"/draft/state";
const pathS   = (id,r) => "leagues/"+id+"/stats/r"+r;
const pathTr  = id => "leagues/"+id+"/trades";
const pathAct = id => "leagues/"+id+"/meta/activity";

async function saveLeague(patch){
  Object.assign(S.league, patch); S.league.updatedAt = Date.now();
  await store.doc(pathL(S.leagueId)).set(clone(S.league));
  render();
}
async function saveTeam(team, patch){
  Object.assign(team, patch||{});
  await store.doc(pathT(S.leagueId)+"/"+team.id).set(clone(team));
  render();
}
async function saveDraft(){ await store.doc(pathD(S.leagueId)).set(clone(S.draft)); render(); }
async function logAct(text){
  S.activity.unshift({t:Date.now(), by:ME.name||"Someone", text});
  S.activity = S.activity.slice(0,120);
  try{ await store.doc(pathAct(S.leagueId)).set({items:clone(S.activity)}); }catch(e){}
}
function unsubAll(){ listeners.splice(0).forEach(u=>{ try{u();}catch(e){} }); }

function subscribe(id){
  unsubAll();
  const onErr = e => { S.err = "Live sync stopped ("+(e.code||"error")+"). Reload the page to reconnect."; render(); };
  listeners.push(store.doc(pathL(id)).onSnapshot(s=>{
    if(!s.exists){ S.err="That league code no longer exists."; S.league=null; S.leagueId=null; LS.del("league"); S.view="landing"; render(); return; }
    S.league = s.data(); render();
  }, onErr));
  listeners.push(store.col(pathT(id)).onSnapshot(s=>{ S.teams = s.docs.map(d=>Object.assign({id:d.id}, d.data())); render(); }, onErr));
  listeners.push(store.doc(pathD(id)).onSnapshot(s=>{ S.draft = s.exists ? s.data() : null; render(); }, onErr));
  listeners.push(store.col(pathTr(id)).onSnapshot(s=>{ S.trades = s.docs.map(d=>Object.assign({id:d.id}, d.data())); render(); }, onErr));
  listeners.push(store.doc(pathAct(id)).onSnapshot(s=>{ S.activity = s.exists ? (s.data().items||[]) : []; render(); }, onErr));
  for(let r=1;r<=TOTAL_ROUNDS;r++){
    listeners.push(store.doc(pathS(id,r)).onSnapshot(s=>{ if(s.exists) S.stats[r]=s.data(); else delete S.stats[r]; render(); }, onErr));
  }
}

async function createLeague(o){
  if(!ME.id){ toast("Sign in before creating a league.","bad"); return null; }
  const id = code6();
  const teams = [];
  for(let i=0;i<o.teamCount;i++){
    teams.push({ id:"t"+(i+1),
      name: i===0 ? (o.myTeam || (ME.name?ME.name+"'s Squad":"Squad 1")) : "Open Slot "+(i+1),
      manager: i===0 ? (ME.name||"You") : "", ownerId: i===0 ? ME.id : null,
      roster:[], rosters:{} });
  }
  const league = { id, name:o.name, season:SEASON, commissionerId:ME.id, commissionerName:ME.name||"Commissioner",
    teamCount:o.teamCount, rosterSize:o.rosterSize, scoring:Object.assign({},o.scoring),
    status:"predraft", currentRound:1, createdAt:Date.now() };
  S.leagueId = id; LS.set("league", id);
  await store.doc(pathL(id)).set(clone(league));
  for(const t of teams) await store.doc(pathT(id)+"/"+t.id).set(clone(t));
  await store.doc(pathD(id)).set({started:false, order:[], picks:[], rounds:o.rosterSize});
  await store.doc(pathAct(id)).set({items:[{t:Date.now(), by:ME.name||"Commissioner", text:"created the league"}]});
  S.view="home"; S.err=null; subscribe(id); render();
  return id;
}
async function joinLeague(codeIn){
  if(!ME.id){ S.err="Sign in before joining a league."; render(); return; }
  const id = String(codeIn||"").trim().toUpperCase();
  if(!/^[A-Z0-9]{6}$/.test(id)){ S.err="League codes are six characters, like 7K2M9Q."; render(); return; }
  const snap = await store.doc(pathL(id)).get();
  if(!snap.exists){ S.err="No league found with code "+id+". Check it with your commissioner."; render(); return; }
  S.leagueId=id; LS.set("league", id); S.err=null; S.view="home"; subscribe(id); render();
}
async function claimTeam(teamId, teamName){
  if(!ME.id){ toast("Sign in before claiming a squad.","bad"); return; }
  const t = teamById(teamId); if(!t) return;
  if(myTeam() && myTeam().id !== teamId){ toast("You already manage a squad in this league.","bad"); return; }
  const meId = ME.id, nm = ME.name||"Manager";
  const res = await store.tx(pathT(S.leagueId)+"/"+teamId, cur=>{
    if(!cur) return null;
    if(cur.ownerId && cur.ownerId !== meId) return null;
    return Object.assign({}, cur, {ownerId:meId, manager:nm, name: teamName || cur.name});
  });
  if(!res){ toast("That slot has just been taken — pick another.","bad"); render(); return; }
  logAct("joined as "+(teamName||t.name));
  S.modal=null; toast("You're in.","good"); render();
}

/* ---------- draft (snake, no positional requirements) ---------- */
function draftSlotFor(pickNo, order){
  const n = order.length; if(!n) return null;
  const rnd = Math.floor(pickNo/n), i = pickNo % n;
  return order[rnd % 2 === 0 ? i : n-1-i];
}
async function startDraft(randomise){
  const ids = S.teams.map(t=>t.id);
  const order = randomise ? ids.slice().sort(()=>Math.random()-0.5) : ids;
  S.draft = {started:true, order, picks:[], rounds:S.league.rosterSize};
  await saveDraft();
  await saveLeague({status:"drafting"});
  logAct("started the draft");
  S.view="draft"; render();
}
async function makePick(playerId){
  const d = S.draft; if(!d || !d.started) return;
  const teamId = draftSlotFor(d.picks.length, d.order);
  const t = teamById(teamId); if(!t) return;
  const mine = myTeam();
  if(!(isCommish() || (mine && mine.id===teamId))){ toast("It's not your pick.","bad"); return; }
  if(ownerOf(playerId)){ toast("Already drafted.","bad"); return; }
  const before = d.picks.length;
  const res = await store.tx(pathD(S.leagueId), cur=>{
    if(!cur || cur.picks.length !== before) return null;
    if(cur.picks.some(p=>p.p===playerId)) return null;
    return Object.assign({}, cur, {picks: cur.picks.concat([{p:playerId, team:teamId, at:Date.now()}])});
  });
  if(!res){ toast("The board moved — have another look.","bad"); render(); return; }
  S.draft = res;
  await saveTeam(t, {roster:(t.roster||[]).concat([playerId])});
  logAct(t.name+" drafted "+P[playerId].name);
  if(res.picks.length >= res.order.length * res.rounds){
    await saveLeague({status:"active"});
    toast("Draft complete. The season is live.","good"); S.view="leaderboard";
  }
  render();
}
async function autopick(){
  const d = S.draft; if(!d) return;
  const taken = rosteredIds();
  const pool = PLAYERS.filter(p=>!taken.has(p.id)).sort((a,b)=> seasonTotals(b.id).fp - seasonTotals(a.id).fp || a.rank-b.rank);
  if(pool[0]) await makePick(pool[0].id);
}

/* ---------- free agents + trades ---------- */
async function addPlayer(pid, dropId){
  const t = myTeam(); if(!t){ toast("Claim a squad first.","bad"); return; }
  if(ownerOf(pid)){ toast("That player is on a squad.","bad"); return; }
  let roster = (t.roster||[]).slice();
  if(roster.length >= S.league.rosterSize){
    if(!dropId){ S.modal={type:"drop", add:pid}; render(); return; }
    roster = roster.filter(x=>x!==dropId);
  } else if(dropId) roster = roster.filter(x=>x!==dropId);
  roster.push(pid);
  await saveTeam(t, {roster});
  logAct(t.name+" signed "+P[pid].name+(dropId?" and released "+P[dropId].name:""));
  S.modal=null; toast("Signed "+P[pid].name+".","good"); render();
}
async function dropPlayer(pid){
  const t = myTeam(); if(!t) return;
  await saveTeam(t, {roster:(t.roster||[]).filter(x=>x!==pid)});
  logAct(t.name+" released "+P[pid].name);
  toast("Released "+P[pid].name+"."); render();
}
async function proposeTrade(toTeamId, give, get){
  const t = myTeam(); if(!t) return;
  if(!give.length || !get.length){ toast("Put at least one player on each side.","bad"); return; }
  const ref = store.col(pathTr(S.leagueId)).doc(uid(10));
  const body = {from:t.id, to:toTeamId, give, get, status:"pending", at:Date.now(), byName:ME.name||"Manager"};
  await ref.set(body);
  if(!store.shared()) S.trades = S.trades.concat([Object.assign({id:ref.id||uid(10)}, body)]);
  logAct(t.name+" offered a trade to "+((teamById(toTeamId)||{}).name||"another squad"));
  S.modal=null; toast("Offer sent.","good"); render();
}
async function respondTrade(tr, accept){
  const me = myTeam();
  if(!me || me.id !== tr.to){ toast("Only the receiving manager can respond.","bad"); return; }
  if(!accept){
    await store.col(pathTr(S.leagueId)).doc(tr.id).set(Object.assign({}, tr, {status:"declined"}));
    if(!store.shared()) tr.status="declined";
    logAct("declined a trade"); render(); return;
  }
  const A = teamById(tr.from), B = teamById(tr.to);
  if(!A || !B) return;
  await saveTeam(A, {roster:(A.roster||[]).filter(x=>!tr.give.includes(x)).concat(tr.get)});
  await saveTeam(B, {roster:(B.roster||[]).filter(x=>!tr.get.includes(x)).concat(tr.give)});
  await store.col(pathTr(S.leagueId)).doc(tr.id).set(Object.assign({}, tr, {status:"accepted"}));
  if(!store.shared()) tr.status="accepted";
  logAct("trade accepted: "+A.name+" ⇄ "+B.name);
  toast("Trade done. Points already banked stay where they were.","good"); render();
}

/* ---------- box scores ---------- */
async function saveStatLine(round, pid, line){
  const cur = clone(S.stats[round] || {lines:{}});
  const clean = {}; let any=false;
  STAT_KEYS.forEach(k=>{ const v=Number(line[k]); if(!isNaN(v) && line[k]!==undefined && line[k]!==""){ clean[k]=v; if(v!==0) any=true; } });
  if(Object.keys(clean).length) cur.lines[pid]=clean; else delete cur.lines[pid];
  S.stats[round]=cur;
  await store.doc(pathS(S.leagueId, round)).set(cur);
  render();
}
async function importCSV(round, text){
  const rows = String(text).split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!rows.length) return {ok:0, miss:[]};
  const first = rows[0].split(",").map(s=>s.trim().toLowerCase());
  const hasHeader = first.includes("player") || first.includes("name");
  const cols = hasHeader ? first : ["player"].concat(STAT_KEYS);
  const start = hasHeader ? 1 : 0;
  const cur = clone(S.stats[round] || {lines:{}});
  const index = {};
  PLAYERS.forEach(p=>{ index[p.name.toLowerCase()]=p.id; index[p.name.toLowerCase().replace(/[^a-z]/g,"")]=p.id; });
  const miss=[]; let ok=0;
  const nameCol = cols.indexOf("player")>=0 ? cols.indexOf("player") : (cols.indexOf("name")>=0 ? cols.indexOf("name") : 0);
  for(let i=start;i<rows.length;i++){
    const cells = rows[i].split(",").map(s=>s.trim());
    const key = String(cells[nameCol]||"").toLowerCase();
    const pid = index[key] || index[key.replace(/[^a-z]/g,"")];
    if(!pid){ if(cells[nameCol]) miss.push(cells[nameCol]); continue; }
    const line={};
    STAT_KEYS.forEach(k=>{ const ci=cols.indexOf(k); if(ci>=0){ const v=Number(cells[ci]); if(!isNaN(v)) line[k]=v; } });
    cur.lines[pid]=line; ok++;
  }
  S.stats[round]=cur;
  await store.doc(pathS(S.leagueId, round)).set(cur);
  render();
  return {ok, miss};
}
async function advanceRound(){
  const from = S.league.currentRound||1;
  const to = Math.min(TOTAL_ROUNDS, from+1);
  if(to===from){ toast("That's the last round of the season."); return; }
  for(const t of S.teams){                        /* freeze who owned what in the round just closed */
    const rosters = Object.assign({}, t.rosters||{});
    rosters[from] = (t.roster||[]).slice();
    await saveTeam(t, {rosters});
  }
  await saveLeague({currentRound: to});
  logAct("closed Round "+from+" and moved to Round "+to);
  toast("Round "+from+" locked. Now on Round "+to+".","good");
}

  const d = S.setup;
  if(!d) return null;
  if(d.error==="not_configured")
    return {head:"Firebase isn\u2019t set up yet",
            body:"The config block at the top of index.html is still empty ("+d.missing.join(", ")+"). Open index.html on GitHub, click the pencil icon, and paste in the six lines from your Firebase console: gear icon \u203a Project settings \u203a Your apps \u203a the </> web app."};
  if(d.error==="init_failed")
    return {head:"Firebase couldn\u2019t start", body:d.detail};
  if(d.authError && String(d.authError).indexOf("api-key-not-valid")>=0)
    return {head:"Firebase rejected your API key",
            body:"The apiKey in index.html isn\u2019t a valid key for this project. Copy the whole firebaseConfig block again from the Firebase console \u2014 gear icon \u203a Project settings \u203a Your apps \u2014 and make sure you\u2019re copying your own values, not an example."};
  if(d.code==="permission-denied")

            body:"The database is reachable but the rules rejected it. Publish the contents of firestore.rules under Firestore Database \u203a Rules, and make sure Google is enabled under Authentication \u203a Sign-in method."};
  return {head:"Couldn\u2019t reach your Firestore database",

}

        '<td class="num"><b>'+r.total.toFixed(1)+'</b></td>'+

      '</tbody></table></div></div>'+
    '<div class="card"><div class="ch"><h3>Activity</h3></div><div class="cb" style="padding:6px 14px 12px">'+

        : '<div class="empty" style="padding:24px"><b>Quiet</b>Signings and trades show up here.</div>')+

  return out;
}

function viewSquad(){

      '<th class="l">Player</th><th>FP for you</th><th>Rounds</th><th>Their total FP</th><th>FP/game</th>'+

      rows.map(x=>'<tr><td class="l">'+pcell(x.p)+'</td>'+

    '<p class="pmeta" style="margin-top:10px">“FP for you” counts only rounds where the player was on your squad. “Their total FP” is everything they’ve scored this season for anyone.</p>';

/* ---------------- Players ---------------- */
function filteredPlayers(){
  const f = S.playerFilter, taken = rosteredIds();
  let list = PLAYERS.slice();
  if(f.q){ const q=f.q.toLowerCase(); list=list.filter(p=>p.name.toLowerCase().includes(q)||CLUB[p.club].name.toLowerCase().includes(q)); }
  if(f.club) list=list.filter(p=>p.club===f.club);
  if(f.pos) list=list.filter(p=>p.pos===f.pos);
  if(f.avail==="free") list=list.filter(p=>!taken.has(p.id));
  if(f.avail==="rostered") list=list.filter(p=>taken.has(p.id));
  if(f.sort==="fpts") list.sort((a,b)=> seasonTotals(b.id).fp-seasonTotals(a.id).fp || a.name.localeCompare(b.name));
  else if(f.sort==="fppg") list.sort((a,b)=> seasonTotals(b.id).fppg-seasonTotals(a.id).fppg || a.name.localeCompare(b.name));
  else if(f.sort==="name") list.sort((a,b)=>a.name.localeCompare(b.name));
  else list.sort((a,b)=> a.club.localeCompare(b.club)||a.name.localeCompare(b.name));
  return list;
}
function viewPlayers(){
  const f=S.playerFilter, list=filteredPlayers(), t=myTeam();
  const drafting = S.league.status==="drafting";
  const d = S.draft;
  const onClock = drafting && d && d.started ? teamById(draftSlotFor(d.picks.length, d.order)) : null;

  return '<div class="pagehead"><h2>Players</h2><p>'+PLAYERS.length+' players across the ten '+SEASON+' clubs. Fantasy points come from the box scores entered for this league.</p></div>'+
    (onClock? '<div class="note" style="margin-bottom:12px"><b>'+esc(onClock.name)+'</b> is on the clock — pick '+(d.picks.length+1)+' of '+(d.order.length*d.rounds)+'.'+(canPick?'':' Only that manager or the commissioner can draft.')+'</div>':'')+
    '<div class="row" style="margin-bottom:12px">'+
      '<input class="inp" data-fk="pq" data-act="pq" value="'+esc(f.q)+'" placeholder="Search player or club" style="max-width:250px">'+
      '<select class="inp" data-act="pclub" style="width:auto"><option value="">All clubs</option>'+CLUBS.map(c=>'<option value="'+c.id+'"'+(f.club===c.id?' selected':'')+'>'+c.name+'</option>').join("")+'</select>'+
      '<select class="inp" data-act="ppos" style="width:auto"><option value="">All positions</option>'+[["G","Guards"],["F","Forwards"],["C","Centres"],["U","Unconfirmed"]].map(o=>'<option value="'+o[0]+'"'+(f.pos===o[0]?' selected':'')+'>'+o[1]+'</option>').join("")+'</select>'+
      '<select class="inp" data-act="pavail" style="width:auto">'+[["all","Everyone"],["free","Free agents"],["rostered","On a squad"]].map(o=>'<option value="'+o[0]+'"'+(f.avail===o[0]?' selected':'')+'>'+o[1]+'</option>').join("")+'</select>'+
      '<select class="inp" data-act="psort" style="width:auto">'+[["fpts","Sort: total FP"],["fppg","Sort: FP per game"],["name","Sort: name"],["club","Sort: club"]].map(o=>'<option value="'+o[0]+'"'+(f.sort===o[0]?' selected':'')+'>'+o[1]+'</option>').join("")+'</select>'+
      '<span class="spacer"></span><span class="pmeta num">'+list.length+' shown</span></div>'+
    '<div class="card"><div class="tw" style="max-height:66vh;overflow-y:auto"><table><thead><tr>'+
      '<th class="l">Player</th><th class="l">Status</th><th>GP</th><th>FP</th><th>FP/G</th>'+
      ["pts","reb","ast","stl","blk","to","tpm"].map(k=>'<th>'+STAT_LABEL[k]+'</th>').join("")+'<th></th></tr></thead><tbody>'+
      list.slice(0,400).map(p=>{
        const own=ownerOf(p.id), s=seasonTotals(p.id);
        const canSign = t && !own && S.league.status==="active";

          '<td class="num">'+s.gp+'</td><td class="num"><b>'+s.fp.toFixed(1)+'</b></td><td class="num">'+s.fppg.toFixed(1)+'</td>'+
          ["pts","reb","ast","stl","blk","to","tpm"].map(k=>'<td class="num">'+s[k]+'</td>').join("")+
          '<td>'+(drafting ? (canPick && !own ? '<button class="btn sm pri" data-act="pick" data-p="'+p.id+'">Draft</button>':'')
                : canSign ? '<button class="btn sm" data-act="add" data-p="'+p.id+'">Sign</button>'
                : (own && t && own.id===t.id ? '<button class="btn sm gh" data-act="drop" data-p="'+p.id+'">Release</button>':''))+'</td></tr>';

/* ---------------- Trades ---------------- */
function viewTrades(){
  const t = myTeam();
  const inbox = S.trades.filter(x=>x.status==="pending" && t && x.to===t.id);
  const out = S.trades.filter(x=>x.status==="pending" && t && x.from===t.id);
  const done = S.trades.filter(x=>x.status!=="pending").sort((a,b)=>b.at-a.at).slice(0,10);
  const card = tr => {
    const A=teamById(tr.from), B=teamById(tr.to);
    return '<div class="card" style="margin-bottom:10px"><div class="cb">'+
      '<div class="row" style="align-items:flex-start;gap:18px">'+
        '<div style="flex:1;min-width:180px"><div class="eyebrow">'+esc(A?A.name:"?")+' sends</div>'+tr.give.map(p=>'<div style="padding:3px 0">'+pcell(P[p])+'</div>').join("")+'</div>'+
        '<div style="align-self:center;font-size:20px;color:var(--faint)">⇄</div>'+
        '<div style="flex:1;min-width:180px"><div class="eyebrow">'+esc(B?B.name:"?")+' sends</div>'+tr.get.map(p=>'<div style="padding:3px 0">'+pcell(P[p])+'</div>').join("")+'</div>'+

      '<span class="pmeta">'+fmtTime(tr.at)+'</span><span class="spacer"></span>'+
      (tr.status==="pending" && t && tr.to===t.id ? '<button class="btn sm pri" data-act="tradeyes" data-t="'+tr.id+'">Accept</button><button class="btn sm dan" data-act="tradeno" data-t="'+tr.id+'">Decline</button>':'')+
      '</div></div></div>';
  };
  return '<div class="pagehead"><h2>Trades</h2><p>Swap players straight up. Points already banked don’t move — they stay with the squad that owned the player at the time.</p></div>'+
    '<div class="row" style="margin-bottom:14px"><button class="btn pri" data-act="newtrade"'+(t?"":" disabled")+'>Propose a trade</button>'+(t?'':'<span class="pmeta">Claim a squad first.</span>')+'</div>'+
    (inbox.length?'<h3 class="eyebrow" style="margin-bottom:8px">Offers to you</h3>'+inbox.map(card).join(""):'')+
    (out.length?'<h3 class="eyebrow" style="margin:16px 0 8px">Your offers</h3>'+out.map(card).join(""):'')+
    (done.length?'<h3 class="eyebrow" style="margin:16px 0 8px">Settled</h3>'+done.map(card).join(""):'')+
    (!inbox.length&&!out.length&&!done.length?'<div class="card"><div class="empty"><b>No offers yet</b>Nothing on the table.</div></div>':'');
}

/* ---------------- Draft Room ---------------- */
function viewDraft(){
  const d = S.draft;
  if(!d || !d.started){
    const open = S.teams.filter(t=>!t.ownerId).length;
    return '<div class="pagehead"><h2>Draft Room</h2><p>Snake draft — the order reverses every round, '+S.league.rosterSize+' rounds to fill each squad. No positional requirements: draft whoever you like.</p></div>'+
      '<div class="card"><div class="cb">'+
      '<div class="row" style="margin-bottom:12px"><span class="pill">'+S.teams.length+' squads</span><span class="pill">'+(S.teams.length*S.league.rosterSize)+' picks</span>'+
      (open?'<span class="pill loss">'+open+' slot'+(open>1?'s':'')+' unclaimed</span>':'<span class="pill win">Everyone in</span>')+'</div>'+
      '<div class="tw"><table><thead><tr><th class="l">Order</th><th class="l">Squad</th><th class="l">Manager</th></tr></thead><tbody>'+
      S.teams.map((t,i)=>'<tr><td class="l num">'+(i+1)+'</td><td class="l">'+esc(t.name)+'</td><td class="l pmeta">'+esc(t.manager||"— open —")+'</td></tr>').join("")+
      '</tbody></table></div>'+
      (isCommish()?'<div class="row" style="margin-top:14px"><button class="btn pri" data-act="startdraft">Start draft (current order)</button><button class="btn" data-act="startdraftrand">Randomise order &amp; start</button></div>'
                  :'<p class="pmeta" style="margin-top:12px">Waiting on the commissioner to start.</p>')+
      '</div></div>';
  }
  const total = d.order.length*d.rounds, done = d.picks.length;
  const complete = done>=total;
  const onTeam = complete? null : teamById(draftSlotFor(done, d.order));
  const t = myTeam(), yours = onTeam && t && onTeam.id===t.id;
  const rnd = Math.min(d.rounds, Math.floor(done/d.order.length)+1);
  const pick = complete? d.order.length : done % d.order.length + 1;

  const head = '<div class="clock'+(yours?" you":"")+'">'+
    (onTeam? '<div><div class="eyebrow">On the clock</div><div style="font-family:var(--f-disp);font-size:26px;text-transform:uppercase">'+esc(onTeam.name)+'</div><div class="pmeta">'+esc(onTeam.manager||"unclaimed")+'</div></div>'
           : '<div><div class="eyebrow">Draft complete</div><div style="font-family:var(--f-disp);font-size:26px;text-transform:uppercase">All picks in</div></div>')+
    '<span class="spacer"></span>'+
    '<div style="text-align:right"><div class="eyebrow">'+(complete?'All '+d.rounds+' rounds done':'Round '+rnd+' · Pick '+pick)+'</div><div class="t">'+done+'<span style="color:var(--faint)">/'+total+'</span></div></div>'+
    (onTeam && (yours||isCommish()) ? '<button class="btn pri" data-nav="players">Pick a player</button><button class="btn" data-act="autopick">Auto-pick</button>':'')+
  '</div>';

  const taken = rosteredIds();
  const best = PLAYERS.filter(p=>!taken.has(p.id)).sort((a,b)=> seasonTotals(b.id).fp-seasonTotals(a.id).fp || a.rank-b.rank).slice(0,14);
  const board = '<div class="card"><div class="ch"><h3>Draft board</h3></div><div class="cb"><div class="board">'+
    d.order.map((tid,ci)=>{
      const tm = teamById(tid); let cells="";
      for(let rr=0; rr<d.rounds; rr++){
        const idx = rr%2===0 ? rr*d.order.length+ci : rr*d.order.length+(d.order.length-1-ci);
        const pk = d.picks[idx], p = pk?P[pk.p]:null;
        cells += '<div class="bcell'+(idx===done?" now":"")+'"><div class="pk">'+(rr+1)+'.'+((idx%d.order.length)+1)+'</div>'+
          (p? stripe(p.club)+'<span style="font-weight:600">'+esc(p.name)+'</span>' : (idx===done?'<span class="pmeta">on the clock</span>':''))+'</div>';
      }
      return '<div class="bcol"><div class="bh">'+esc(tm?tm.name:tid)+'</div>'+cells+'</div>';
    }).join("")+'</div></div></div>';
  const bb = '<div class="card"><div class="ch"><h3>Best available</h3></div><div class="tw"><table><thead><tr><th class="l">Player</th><th>FP</th><th></th></tr></thead><tbody>'+
    best.map(p=>'<tr><td class="l">'+pcell(p)+'</td><td class="num">'+seasonTotals(p.id).fp.toFixed(1)+'</td>'+
      '<td>'+((yours||isCommish()) && onTeam ? '<button class="btn sm pri" data-act="pick" data-p="'+p.id+'">Draft</button>':'')+'</td></tr>').join("")+
    '</tbody></table></div></div>';
  return '<div class="pagehead"><h2>Draft Room</h2><p>Snake order — it reverses each round. Only the manager on the clock, or the commissioner, can submit a pick.</p></div>'+
    head+'<div class="draftgrid" style="margin-top:14px">'+board+bb+'</div>';
}

/* ---------------- Box Scores ---------------- */
function viewStats(){
  const r = S.statRound, cur = S.stats[r] || {lines:{}};
  const entered = Object.keys(cur.lines||{}).length;
  const taken = rosteredIds(), f = S.playerFilter;
  let list = PLAYERS.filter(p=> S.statOnlyRostered ? taken.has(p.id) : true);
  if(f.q){ const q=f.q.toLowerCase(); list=list.filter(p=>p.name.toLowerCase().includes(q)||CLUB[p.club].name.toLowerCase().includes(q)); }
  if(f.club) list=list.filter(p=>p.club===f.club);
  list.sort((a,b)=> a.club.localeCompare(b.club)||a.name.localeCompare(b.name));
  return '<div class="pagehead"><h2>Box Scores</h2><p>Where the real numbers come in. Enter each player’s line for the round, or paste a CSV. Every total on the site is calculated from this.</p></div>'+
    '<div class="note" style="margin-bottom:14px"><b>Why manual?</b> The NBL’s official statistics are licensed, with no free public feed to read from. Rather than invent numbers, this is the one thing a human supplies. Copy them from the NBL match centre after each round.</div>'+
    '<div class="row" style="margin-bottom:12px">'+
      '<label class="fl" style="margin:0">Round</label>'+
      '<select class="inp" data-act="statround" style="width:auto">'+Array.from({length:TOTAL_ROUNDS},(_,i)=>'<option value="'+(i+1)+'"'+(i+1===r?' selected':'')+'>Round '+(i+1)+(S.stats[i+1]&&Object.keys(S.stats[i+1].lines||{}).length?' · '+Object.keys(S.stats[i+1].lines).length+' lines':'')+'</option>').join("")+'</select>'+
      '<span class="pill">'+entered+' line'+(entered===1?'':'s')+' entered</span>'+
      '<label class="row" style="gap:6px;font-size:13px"><input type="checkbox" data-act="onlyrost"'+(S.statOnlyRostered?" checked":"")+'> Only drafted players</label>'+
      '<span class="spacer"></span><button class="btn" data-act="csv">Paste CSV</button><button class="btn dan" data-act="clearround">Clear round</button></div>'+
    '<div class="row" style="margin-bottom:10px">'+
      '<input class="inp" data-fk="pq" data-act="pq" value="'+esc(f.q)+'" placeholder="Find a player" style="max-width:230px">'+
      '<select class="inp" data-act="pclub" style="width:auto"><option value="">All clubs</option>'+CLUBS.map(c=>'<option value="'+c.id+'"'+(f.club===c.id?' selected':'')+'>'+c.name+'</option>').join("")+'</select></div>'+
    '<div class="card"><div class="tw" style="max-height:64vh;overflow-y:auto"><table><thead><tr><th class="l">Player</th>'+
      STAT_KEYS.map(k=>'<th>'+STAT_LABEL[k]+'</th>').join("")+'<th>FP</th></tr></thead><tbody>'+
      list.slice(0,260).map(p=>{
        const l=(cur.lines||{})[p.id]||{};
        return '<tr><td class="l">'+pcell(p)+'</td>'+
          STAT_KEYS.map(k=>'<td><input class="inp num" data-fk="st-'+p.id+'-'+k+'" data-stat="'+k+'" data-p="'+p.id+'" value="'+(l[k]!=null?l[k]:"")+'" inputmode="numeric" style="width:52px;padding:3px 5px;text-align:right"></td>').join("")+
          '<td class="num"><b>'+(Object.keys(l).length?fpts(l,S.league.scoring).toFixed(1):"—")+'</b></td></tr>';
      }).join("")+'</tbody></table></div></div>'+
    (list.length>260?'<p class="pmeta" style="margin-top:8px">First 260 shown — filter to reach the rest.</p>':'');
}

      '<div class="field"><label class="fl">Current round</label><div class="row"><span class="big">'+L.currentRound+'</span>'+

      '<div class="field"><label class="fl">Status</label><span class="pill">'+L.status+'</span></div>'+

      '<p class="pmeta">Backend: '+(BACKEND==="firebase"?"Firebase (shared)":BACKEND==="claude"?"Claude artifact database (shared)":"local browser storage only")+'.</p>'+

/* ---------------- Modals ---------------- */
function renderModal(){
  const m = S.modal;
  const wrap = (title, body, foot, wide) =>
    '<div class="veil" data-act="veil"><div class="modal'+(wide?" wide":"")+'" role="dialog" aria-modal="true">'+
    '<div class="mh"><h3>'+title+'</h3><button class="btn sm gh" data-act="closemodal" aria-label="Close">✕</button></div>'+
    '<div class="mb">'+body+'</div>'+(foot?'<div class="mf">'+foot+'</div>':'')+'</div></div>';

  if(m.type==="newleague"){
    return wrap("Create a league",
      '<div class="field"><label class="fl">Your name</label><input class="inp" data-fk="nl-me" id="nl-me" value="'+esc(ME.name || (S.user?S.user.name:""))+'" placeholder="Kai"></div>'+
      '<div class="field"><label class="fl">League name</label><input class="inp" data-fk="nl-name" id="nl-name" placeholder="Thursday Night Hoops"></div>'+
      '<div class="field"><label class="fl">Your squad name</label><input class="inp" data-fk="nl-team" id="nl-team" placeholder="Cotton Club"></div>'+
      '<div class="row"><div class="field" style="flex:1"><label class="fl">Squads</label><select class="inp" id="nl-count">'+[4,6,8,10,12].map(n=>'<option'+(n===8?' selected':'')+'>'+n+'</option>').join("")+'</select></div>'+
      '<div class="field" style="flex:1"><label class="fl">Players per squad</label><select class="inp" id="nl-size">'+[8,10,12,14].map(n=>'<option'+(n===DEFAULT_ROSTER_SIZE?' selected':'')+'>'+n+'</option>').join("")+'</select></div></div>'+
      '<p class="pmeta">Every player on a squad scores every round — there is no bench and no lineup to set.</p>',
      '<button class="btn" data-act="closemodal">Cancel</button><button class="btn pri" data-act="createleague">Create</button>');
  }
  if(m.type==="claim"){
    const open = S.teams.filter(t=>!t.ownerId);
    return wrap("Claim a squad",
      '<div class="field"><label class="fl">Your name</label><input class="inp" data-fk="cl-me" id="cl-me" value="'+esc(ME.name || (S.user?S.user.name:""))+'" placeholder="Kai"></div>'+
      (open.length? '<div class="field"><label class="fl">Rename it (optional)</label><input class="inp" data-fk="cl-team" id="cl-team" placeholder="Leave blank to keep the slot name"></div>'+
        '<div class="field"><label class="fl">Open slots</label>'+
        open.map(t=>'<div class="slot" style="margin-bottom:6px"><div class="lbl">'+esc(t.id.replace("t",""))+'</div><div class="who"><b>'+esc(t.name)+'</b></div><button class="btn sm pri" data-act="doclaim" data-t="'+t.id+'">Take it</button></div>').join("")+'</div>'
        : '<div class="empty"><b>All taken</b>Every slot in this league has a manager.</div>'),
      '<button class="btn" data-act="closemodal">Close</button>');
  }
  if(m.type==="drop"){
    const t = myTeam();
    return wrap("Squad is full — release someone",
      '<p class="pmeta" style="margin-top:0">Signing <b>'+esc(P[m.add].name)+'</b> means releasing one of these. Points they already banked stay with you.</p>'+
      (t.roster||[]).map(pid=>'<div class="slot" style="margin-bottom:6px"><div class="lbl">'+(P[pid]?P[pid].pos:"")+'</div><div class="who">'+pcell(P[pid])+'</div><button class="btn sm dan" data-act="dodrop" data-p="'+pid+'">Release</button></div>').join(""),
      '<button class="btn" data-act="closemodal">Cancel</button>');
  }
  if(m.type==="csv"){
    return wrap("Paste a CSV of box scores",
      '<p class="pmeta" style="margin-top:0">One row per player. A header row is optional; without one the column order is assumed to be:<br><code class="mono">player,'+STAT_KEYS.join(",")+'</code></p>'+
      '<textarea class="inp mono" data-fk="csvbox" id="csvbox" rows="10" placeholder="player,min,pts,reb,ast,stl,blk,to,fgm,fga,ftm,fta,tpm&#10;Bryce Cotton,34,28,4,6,1,0,3,9,19,6,7,4"></textarea>'+
      (m.report? '<div class="note" style="margin-top:10px">Imported '+m.report.ok+' line'+(m.report.ok===1?'':'s')+' into Round '+S.statRound+'.'+(m.report.miss.length?' Not matched to a player: '+esc(m.report.miss.slice(0,12).join(", "))+(m.report.miss.length>12?' …':''):'')+'</div>':''),
      '<button class="btn" data-act="closemodal">Close</button><button class="btn pri" data-act="doimport">Import into Round '+S.statRound+'</button>', true);
  }
  if(m.type==="trade"){
    const me = myTeam(), other = m.other?teamById(m.other):null;
    const col = (t, chosen, key) => !t ? '' :
      '<div style="flex:1;min-width:200px"><div class="eyebrow" style="margin-bottom:6px">'+esc(t.name)+'</div>'+
      (t.roster||[]).map(pid=>'<label class="slot" style="margin-bottom:5px;cursor:pointer"><input type="checkbox" data-tsel="'+key+'" data-p="'+pid+'"'+(chosen.includes(pid)?" checked":"")+'><div class="who">'+pcell(P[pid])+'</div></label>').join("")+'</div>';
    return wrap("Propose a trade",
      '<div class="field"><label class="fl">Trade with</label><select class="inp" id="tradewith" data-act="tradewith"><option value="">Choose a squad…</option>'+
        S.teams.filter(t=>me&&t.id!==me.id&&t.ownerId).map(t=>'<option value="'+t.id+'"'+(m.other===t.id?' selected':'')+'>'+esc(t.name)+' — '+esc(t.manager)+'</option>').join("")+'</select></div>'+
      (other? '<div class="row" style="align-items:flex-start;gap:16px">'+col(me,m.give||[],"give")+col(other,m.get||[],"get")+'</div>' : '<p class="pmeta">Pick a squad to see their roster.</p>'),
      '<button class="btn" data-act="closemodal">Cancel</button><button class="btn pri" data-act="sendtrade"'+(other?"":" disabled")+'>Send offer</button>', true);
  }
  if(m.type==="rename"){
    const t = myTeam();
    return wrap("Rename your squad",
      '<div class="field"><label class="fl">Squad name</label><input class="inp" data-fk="rn" id="rn" value="'+esc(t.name)+'"></div>'+
      '<div class="field"><label class="fl">Manager name</label><input class="inp" data-fk="rnm" id="rnm" value="'+esc(t.manager||ME.name)+'"></div>',
      '<button class="btn" data-act="closemodal">Cancel</button><button class="btn pri" data-act="dorename">Save</button>');
  }
  if(m.type==="confirm"){
    return wrap(esc(m.title), '<p style="margin:0">'+esc(m.body)+'</p>',
      '<button class="btn" data-act="closemodal">Cancel</button><button class="btn dan" data-act="'+m.act+'">'+esc(m.ok)+'</button>');
  }
  return "";
}

/* ============================================================
   EVENTS
   ============================================================ */
let wired = false;
function wire(){
  if(wired) return; wired = true;

  document.addEventListener("click", async (e)=>{
    const navEl = e.target.closest("[data-nav]");
    if(navEl){ S.view=navEl.dataset.nav; S.modal=null; render(); return; }
    const el = e.target.closest("[data-act]");
    if(!el) return;
    const a = el.dataset.act, pid = el.dataset.p, tid = el.dataset.t;
    if(a==="veil"){ if(e.target===el){ S.modal=null; render(); } return; }
    try{
      switch(a){
        case "closemodal": S.modal=null; render(); break;
        case "theme": {
          const cur = document.documentElement.getAttribute("data-theme");
          const next = cur==="dark" ? "light" : cur==="light" ? "dark" : (matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark");
          document.documentElement.setAttribute("data-theme", next); LS.set("theme", next); break;
        }
        case "signin": await signIn(); break;
        case "signout": await signOutNow(); break;
        case "new-league": S.modal={type:"newleague"}; render(); break;
        case "join": await joinLeague(document.getElementById("joincode").value); break;
        case "leave": LS.del("league"); unsubAll(); S.league=null; S.leagueId=null; S.teams=[]; S.stats={}; S.draft=null; S.trades=[]; S.activity=[]; S.view="landing"; S.err=null; render(); break;
        case "claim": S.modal={type:"claim"}; render(); break;
        case "createleague": {
          ME.name=(document.getElementById("nl-me").value||"").trim()||"Commissioner"; saveName();
          const name=(document.getElementById("nl-name").value||"").trim()||"My NBL League";
          const team=(document.getElementById("nl-team").value||"").trim();
          const count=Number(document.getElementById("nl-count").value)||8;
          const size=Number(document.getElementById("nl-size").value)||DEFAULT_ROSTER_SIZE;
          S.modal=null; render();
          const id = await createLeague({name, myTeam:team, teamCount:count, rosterSize:size, scoring:DEFAULT_SCORING});
          toast("League created. Code: "+id,"good"); break;
        }
        case "doclaim": {
          ME.name=(document.getElementById("cl-me").value||"").trim()||"Manager"; saveName();
          const nmEl=document.getElementById("cl-team");
          await claimTeam(tid, ((nmEl&&nmEl.value)||"").trim()); break;
        }
        case "startdraft": await startDraft(false); break;
        case "startdraftrand": await startDraft(true); break;
        case "autopick": await autopick(); break;
        case "pick": await makePick(pid); break;
        case "add": await addPlayer(pid); break;
        case "dodrop": await addPlayer(S.modal.add, pid); break;
        case "drop": S.modal={type:"confirm", title:"Release "+P[pid].name+"?", body:"They return to the free agent pool. Points they already banked stay on your season total.", ok:"Release", act:"confirmdrop", p:pid}; render(); break;
        case "confirmdrop": { const q=S.modal.p; S.modal=null; await dropPlayer(q); break; }
        case "renameteam": S.modal={type:"rename"}; render(); break;
        case "dorename": { const t=myTeam(); ME.name=(document.getElementById("rnm").value||"").trim()||ME.name; saveName();
          await saveTeam(t,{name:(document.getElementById("rn").value||"").trim()||t.name, manager:ME.name}); S.modal=null; render(); break; }
        case "nextround": await advanceRound(); break;
        case "csv": S.modal={type:"csv"}; render(); break;
        case "doimport": { const rep=await importCSV(S.statRound, document.getElementById("csvbox").value); S.modal={type:"csv", report:rep}; render(); break; }
        case "clearround": S.modal={type:"confirm", title:"Clear Round "+S.statRound+"?", body:"Every box score line entered for this round is deleted, and every squad's total is recalculated without it.", ok:"Clear", act:"confirmclear"}; render(); break;
        case "confirmclear": { S.modal=null; S.stats[S.statRound]={lines:{}}; await store.doc(pathS(S.leagueId,S.statRound)).set({lines:{}}); render(); break; }
        case "newtrade": S.modal={type:"trade", give:[], get:[]}; render(); break;
        case "sendtrade": await proposeTrade(S.modal.other, S.modal.give, S.modal.get); break;
        case "tradeyes": await respondTrade(S.trades.find(x=>x.id===tid), true); break;
        case "tradeno": await respondTrade(S.trades.find(x=>x.id===tid), false); break;
        case "copycode": try{ await navigator.clipboard.writeText(S.leagueId); toast("Code copied."); }catch(err){ toast("Copy didn't work — select it by hand.","bad"); } break;
        case "resetscoring": await saveLeague({scoring:Object.assign({},DEFAULT_SCORING)}); toast("Scoring reset."); break;
        case "rsize": { const n=Math.max(4, Math.min(16, S.league.rosterSize + Number(el.dataset.d)));
          await saveLeague({rosterSize:n});
          if(S.draft) { S.draft.rounds=n; await saveDraft(); } break; }
        case "addteam": { const n=S.teams.length+1; const t={id:"t"+n, name:"Open Slot "+n, manager:"", ownerId:null, roster:[], rosters:{}};
          await store.doc(pathT(S.leagueId)+"/"+t.id).set(t); await saveLeague({teamCount:n}); break; }
        case "kick": { const t=teamById(tid); if(t){ S.modal={type:"confirm", title:"Free up "+t.name+"?", body:"The slot opens for someone else to claim. The roster and its points stay with the slot.", ok:"Free the slot", act:"confirmkick", t:tid}; render(); } break; }
        case "confirmkick": { const t=teamById(S.modal.t); S.modal=null; if(t) await saveTeam(t,{ownerId:null, manager:""}); render(); break; }
      }
    }catch(err){ console.error(err); toast("That didn't go through: "+(err && err.message ? err.message : "unknown error"),"bad"); }
  });

  document.addEventListener("change", async (e)=>{
    const el = e.target;
    try{
      if(el.dataset.stat){
        const prev = (S.stats[S.statRound] && S.stats[S.statRound].lines && S.stats[S.statRound].lines[el.dataset.p]) || {};
        const l = Object.assign({}, prev);
        const v = el.value.trim();
        if(v==="") delete l[el.dataset.stat]; else l[el.dataset.stat] = Number(v)||0;
        await saveStatLine(S.statRound, el.dataset.p, l); return;
      }
      if(el.dataset.score){ const sc=Object.assign({}, S.league.scoring); sc[el.dataset.score]=Number(el.value)||0; await saveLeague({scoring:sc}); return; }
      if(el.dataset.tsel){ const k=el.dataset.tsel, arr=(S.modal[k]||[]).slice(); const i=arr.indexOf(el.dataset.p);
        if(el.checked && i<0) arr.push(el.dataset.p); else if(!el.checked && i>=0) arr.splice(i,1);
        S.modal[k]=arr; return; }
      const a = el.dataset.act;
      if(a==="statround"){ S.statRound=Number(el.value); render(); }
      if(a==="onlyrost"){ S.statOnlyRostered=el.checked; render(); }
      if(a==="pclub"){ S.playerFilter.club=el.value; render(); }
      if(a==="ppos"){ S.playerFilter.pos=el.value; render(); }
      if(a==="pavail"){ S.playerFilter.avail=el.value; render(); }
      if(a==="psort"){ S.playerFilter.sort=el.value; render(); }
      if(a==="tradewith"){ S.modal.other=el.value; S.modal.give=[]; S.modal.get=[]; render(); }
      if(a==="lname"){ await saveLeague({name: el.value.trim()||S.league.name}); }
    }catch(err){ console.error(err); toast("Couldn't save that: "+(err&&err.message?err.message:"unknown error"),"bad"); }
  });

  document.addEventListener("input", (e)=>{ if(e.target.dataset.act==="pq"){ S.playerFilter.q=e.target.value; render(); } });
  document.addEventListener("keydown",(e)=>{ if(e.key==="Escape" && S.modal){ S.modal=null; render(); } });
}

/* ============================================================
   BOOT
   ============================================================ */
/* ------------------------------------------------------------
   AUTH — one Google account, recognised on every device.
   ------------------------------------------------------------ */
async function applyAuth(u){
  const wasId = ME.id;
  if(u){
    S.user = {uid:u.uid, name: u.displayName || u.email || "Manager", email: u.email || "", photo: u.photoURL || ""};
    ME.id = u.uid;
    if(!ME.name) ME.name = S.user.name;
    LS.set("me", {id:null, name:ME.name});     /* cache the name only, never the id */
  } else {
    S.user = null; ME.id = null;
  }
  if(wasId === ME.id) return;                  /* nothing actually changed */
  unsubAll();
  S.league=null; S.teams=[]; S.draft=null; S.stats={}; S.trades=[]; S.activity=[];
  if(S.user) await openSavedLeague(); else { S.view="landing"; }
  render();
}
async function signIn(){
  if(!FB || !FB.api) return;
  S.signingIn = true; S.authErr = null; render();
  try{
    await FB.api.signIn();
    S.authErr = null;
  }catch(e){
    const c = (e && e.code) || "";
    S.authErr =
      c.indexOf("unauthorized-domain")>=0 ? "This site's address isn't on your Firebase project's authorised list. In the Firebase console: Authentication → Settings → Authorized domains → Add domain → ksummer01.github.io" :
      c.indexOf("popup-blocked")>=0        ? "Your browser blocked the sign-in popup. Allow popups for this site and try again." :
      c.indexOf("popup-closed")>=0 || c.indexOf("cancelled-popup")>=0 ? "Sign-in was cancelled." :
      c.indexOf("operation-not-allowed")>=0 ? "Google sign-in isn't switched on for this Firebase project yet. Console → Authentication → Sign-in method → Google → Enable." :
      "Sign-in failed" + (c ? " ("+c+")" : "") + ".";
  }
  S.signingIn = false; render();
}
async function signOutNow(){
  if(!FB || !FB.api) return;
  try{ await FB.api.signOut(); }catch(e){ toast("Couldn't sign out: "+((e&&e.code)||"error"),"bad"); }
}
async function openSavedLeague(){
  if(!S.leagueId) return;
  try{
    const snap = await store.doc(pathL(S.leagueId)).get();
    if(snap.exists){ subscribe(S.leagueId); S.view = "home"; }
    else { LS.del("league"); S.leagueId=null; }
  }catch(e){
    console.error(e);
    S.err = "Couldn't reach the league database: "+(e.message||e.code||"unknown error");
    S.leagueId = null;
  }
}

async function boot(){
  const th = LS.get("theme", null);
  if(th) document.documentElement.setAttribute("data-theme", th);
  wire();

  /* pick a backend */
  let fb = null;
  try{ fb = window.__fbReady ? await window.__fbReady : null; }catch(e){ console.warn(e); }
  if(fb && fb.db){ FB = fb; BACKEND = "firebase"; }
  else if(fb && fb.error){ S.setup = fb; }

  if(BACKEND!=="firebase" && typeof window.claude!=="undefined" && window.claude.use){
    try{ const d = await window.claude.use("db"); if(d){ CDB = d; BACKEND = "claude"; } }catch(e){}
  }
  S.noStore = (BACKEND==="memory");
  if(S.noStore){ S.leagueId = null; render(); return; }

  if(BACKEND==="firebase"){
    render();
    /* wait for Firebase to say whether a session already exists on this device */
    await new Promise(resolve=>{
      let first = true;
      FB.api.onChange(async (u)=>{
        if(first){
          first = false;
          S.user = u ? {uid:u.uid, name:u.displayName||u.email||"Manager", email:u.email||"", photo:u.photoURL||""} : null;
          if(u){ ME.id = u.uid; if(!ME.name) ME.name = S.user.name; LS.set("me",{id:null,name:ME.name}); }
          S.authReady = true;
          resolve();
        } else {
          await applyAuth(u);                  /* later sign-in / sign-out */
        }
      });
      setTimeout(()=>{ if(first){ first=false; S.authReady=true; resolve(); } }, 10000);
    });

    /* Only probe once signed in — the rules require an authenticated request. */
    if(S.user){
      const probe = await Promise.race([
        store.doc("leagues/__connection_probe").get().then(()=>({ok:true}), e=>({ok:false, code:(e&&e.code)||"error"})),
        sleep(10000).then(()=>({ok:false, code:"timeout"}))
      ]);
      if(!probe.ok){
        BACKEND = "memory"; FB = null; S.noStore = true;
        S.setup = {error:"unreachable", code:probe.code};
        S.leagueId = null; render(); return;
      }
      await openSavedLeague();
    }
  } else if(BACKEND==="claude"){
    S.authReady = true;
    await openSavedLeague();
  }
  render();
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
